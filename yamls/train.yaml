debug: false
hydra:
  run:
    dir: 'experiments/${now:%Y%m%d}-${now:%H%M%S}'
run_mode: train
folder_path: ./data/lmd_filt_octuple/
cache_path: dataset_cache/dataset_cache.pkl
split_path: lakh_split_files.pkl
val_check_interval: 0.25
checkpoint_folder: null
checkpoint_file: null
random_seed: 0
batch_size: 64
num_workers: 8
dim: 512
depth: 4
heads: 8
max_len: 1024
rate: 0
masking: 0.8
replace: 0.1
loss_weights:
  - 0.3
  - 1
lr: 1e-4
epochs: 100
warm_up: 10000
total_steps: 25000
temp: 0.1
gpus:
  - 0
mode:
  - BERT-aug
  - BERT-neighbor
masking_strategy:
  - element
  - compound
  - bar
pin_memory: false